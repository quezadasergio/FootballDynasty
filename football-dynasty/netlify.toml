# Publica la exportación web de Godot (carpeta build/web).
# Si Netlify usa Base directory = football-dynasty, este archivo aplica.
# Si Netlify usa la raíz del monorepo, usa el netlify.toml de la raíz del repo.

[build]
  publish = "build/web"
  command = "test -f build/web/index.html || (echo 'Falta build/web/index.html. Exporta con ./scripts/export_web.sh y haz commit/push.' && exit 1)"

[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"

[[headers]]
  for = "/*.pck"
  [headers.values]
    Content-Type = "application/octet-stream"
